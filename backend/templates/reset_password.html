<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Reset Password</title>
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Reset Password</h5>
              <div id="msg"></div>
              <form id="resetForm">
                <div class="mb-3">
                  <label class="form-label">New password</label>
                  <input type="password" id="new_password" class="form-control" required minlength="6" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Confirm password</label>
                  <input type="password" id="confirm_password" class="form-control" required minlength="6" />
                </div>
                <button type="submit" class="btn btn-primary">Set password</button>
              </form>
              <div class="mt-3"><a href="/">Back to home</a></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function showMsg(msg, cls='danger'){
        document.getElementById('msg').innerHTML = `<div class="alert alert-${cls}">${msg}</div>`;
      }
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      if(!token){ showMsg('Missing token in link', 'warning'); document.getElementById('resetForm').style.display='none'; }
      document.getElementById('resetForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const p1 = document.getElementById('new_password').value;
        const p2 = document.getElementById('confirm_password').value;
        if(p1 !== p2){ showMsg('Passwords do not match', 'warning'); return; }
        try{
          const res = await fetch('/api/auth/reset_password', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ token: token, new_password: p1 }) });
          const j = await res.json();
          if(res.ok){
            showMsg('Password updated successfully. You will receive a confirmation email shortly.', 'success');
            document.getElementById('resetForm').reset();
            document.getElementById('resetForm').style.display='none';
          } else {
            showMsg(j.msg || 'Failed: ' + JSON.stringify(j), 'danger');
          }
        } catch(err){ showMsg('Network error', 'danger'); }
      });
    </script>
  </body>
</html>
